<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#E8E9EC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gestion Bar">
<link rel="manifest" href='data:application/manifest+json,{"name":"Gestion Bar-Restaurant","short_name":"Gestion Bar","start_url":".","display":"standalone","background_color":"%23E8E9EC","theme_color":"%23E8E9EC"}'>
<title>Gestion Bar-Restaurant</title>
<style>
:root{
  --bg:#E8E9EC; --card:#FFFFFF; --key:#F2F3F5; --ink:#1B1C1E; --sub:#84878D;
  --acc:#E0995C; --acc-d:#B06F33; --acc-soft:#F6EDE2;
  --dark:#26282C;
  --line:#F0F1F3; --danger:#C0392B; --okc:#1D6F3C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;}
.hidden{display:none !important;}
.num,.v,.big,.cashd,.codebig{font-variant-numeric:tabular-nums;}

/* ---------- entête façon convertisseur ---------- */
.hdr{display:flex;align-items:center;gap:14px;padding:18px 18px 10px;background:var(--bg);
  position:sticky;top:0;z-index:30;}
.hbk{width:44px;height:44px;border-radius:50%;background:none;border:none;font-size:26px;
  font-weight:700;color:var(--ink);cursor:pointer;flex:none;padding:0;line-height:1;}
.hdr .hm{flex:1;min-width:0;}
.hdr h1{margin:0;font-size:27px;font-weight:800;letter-spacing:-.4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr .sub{font-size:12.5px;color:var(--sub);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hbtn{width:42px;height:42px;border-radius:50%;background:var(--card);border:none;
  font-size:20px;font-weight:800;color:var(--ink);cursor:pointer;flex:none;
  box-shadow:0 1px 3px rgba(27,28,30,.08);}

main{max-width:820px;margin:0 auto;padding:8px 14px 120px;}

/* ---------- tuiles menu (style convertisseur) ---------- */
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;}
@media(max-width:360px){.tgrid{grid-template-columns:repeat(2,1fr);}}
.t2{background:var(--card);border-radius:22px;padding:26px 8px 20px;text-align:center;border:none;
  cursor:pointer;position:relative;font-family:inherit;box-shadow:0 1px 3px rgba(27,28,30,.05);}
.t2:active{transform:scale(.97);}
.t2 svg{width:30px;height:30px;display:block;margin:0 auto;}
.t2 .lb{font-size:15.5px;font-weight:700;margin-top:12px;color:var(--ink);line-height:1.3;}
.t2 .bd{position:absolute;top:10px;right:10px;background:var(--dark);color:#fff;border-radius:999px;
  min-width:24px;height:24px;padding:0 6px;font-size:13px;font-weight:800;
  display:flex;align-items:center;justify-content:center;}

/* ---------- cartes & gros chiffres ---------- */
.card{background:var(--card);border:none;border-radius:22px;padding:18px;margin-bottom:12px;
  box-shadow:0 1px 3px rgba(27,28,30,.05);}
.card > h2{margin:0 0 12px;font-size:17px;font-weight:800;letter-spacing:-.2px;}
.card > h2 .rt{float:right;font-weight:600;font-size:13px;color:var(--sub);}
.big{font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1.1;}
.big.mid{font-size:28px;}
.lbl{font-size:12px;color:var(--sub);font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
.statrow{display:flex;gap:6px;margin-top:14px;}
.statrow > div{flex:1;text-align:center;}
.statrow .v{font-size:17px;font-weight:800;}
.statrow .l{font-size:11px;color:var(--sub);font-weight:600;margin-top:2px;}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:9px;margin-bottom:12px;}
.kpi{background:var(--card);border-radius:18px;padding:14px 8px;text-align:center;
  box-shadow:0 1px 3px rgba(27,28,30,.05);}
.kpi .v{font-size:19px;font-weight:800;line-height:1.15;}
.kpi .l{font-size:11px;color:var(--sub);margin-top:4px;line-height:1.25;font-weight:600;}
.kpi.bad .v{color:var(--danger);} .kpi.warn .v{color:var(--acc-d);}

/* ---------- boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;
  border-radius:999px;padding:14px 20px;font-size:15.5px;font-weight:700;cursor:pointer;
  min-height:50px;font-family:inherit;transition:transform .05s;}
.btn:active{transform:scale(.97);}
.b-acc,.b-navy{background:var(--dark);color:#fff;box-shadow:0 3px 10px rgba(38,40,44,.22);}
.b-out{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(27,28,30,.08);}
.b-grey{background:#ECEDEF;color:var(--ink);}
.b-red{background:var(--card);color:var(--danger);box-shadow:0 1px 3px rgba(27,28,30,.08);}
.btn[disabled]{opacity:.35;cursor:not-allowed;box-shadow:none;}
.full{width:100%;}
.sm{min-height:38px;padding:8px 14px;font-size:13px;}
.btnrow{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px;}
.btnrow .btn{flex:1 1 auto;}

/* ---------- pavé calculatrice ---------- */
.kpad{display:grid;grid-template-columns:repeat(3,76px);gap:17px;justify-content:center;padding:8px 0 4px;}
.kpad4{grid-template-columns:repeat(4,66px);gap:13px;}
.key{width:76px;height:76px;border-radius:50%;background:var(--key);border:none;
  font-size:27px;font-weight:600;color:var(--ink);cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;
  box-shadow:5px 5px 11px rgba(158,161,168,.42),-5px -5px 11px rgba(255,255,255,.95);}
.kpad4 .key{width:66px;height:66px;font-size:22px;}
.key:active{box-shadow:inset 3px 3px 7px rgba(158,161,168,.4),inset -3px -3px 7px rgba(255,255,255,.9);}
.key.fn{font-size:20px;color:#3A3D42;background:#E9EAED;}
.key.acc{background:linear-gradient(180deg,#F2A968,#E08B42);color:#fff;
  box-shadow:5px 5px 12px rgba(224,139,66,.3),-4px -4px 10px rgba(255,255,255,.85);}
.key.acc:active{box-shadow:inset 3px 3px 8px rgba(160,90,30,.4);}
.key[disabled]{opacity:.35;}
.dots{display:flex;gap:16px;justify-content:center;padding:20px 0 16px;}
.dots i{width:16px;height:16px;border-radius:50%;background:#D2D4D9;transition:background .12s;}
.dots i.f{background:var(--ink);}
.dots.err{animation:shake .35s;}
.dots.err i{background:var(--danger);}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.loginw{display:flex;flex-direction:column;min-height:calc(100dvh - 120px);}
.loginw .haut{padding-top:5vh;text-align:center;}
.loginw .haut .t{font-size:21px;font-weight:800;}
.loginw .bas{margin-top:auto;padding-bottom:12px;}
.cashd{text-align:right;font-size:42px;font-weight:800;padding:8px 12px 0;min-height:58px;letter-spacing:-1px;}
.cashi{text-align:right;font-size:14.5px;color:var(--sub);padding:0 12px 12px;min-height:24px;font-weight:600;}
.cashi.ok{color:var(--okc);} .cashi.ko{color:var(--danger);}

/* ---------- accueil ---------- */
.tile{background:var(--card);border-radius:22px;padding:24px 20px;margin-bottom:12px;cursor:pointer;
  box-shadow:0 1px 3px rgba(27,28,30,.05);border:none;width:100%;text-align:left;font-family:inherit;}
.tile .tt{font-size:19px;font-weight:800;}
.tile .td{font-size:13px;color:var(--sub);margin-top:5px;line-height:1.45;}
.rolepick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.rolepick button{background:var(--key);border:2px solid transparent;border-radius:18px;padding:16px 10px;
  font-family:inherit;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer;line-height:1.4;}
.rolepick button.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc-d);}

/* ---------- catalogue ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;-webkit-overflow-scrolling:touch;}
.chips::-webkit-scrollbar{display:none;}
.chip{background:var(--card);border:none;border-radius:999px;padding:10px 16px;font-size:13.5px;
  font-weight:700;color:var(--sub);cursor:pointer;white-space:nowrap;font-family:inherit;flex:none;
  box-shadow:0 1px 2px rgba(27,28,30,.05);}
.chip.on{color:var(--acc-d);background:var(--acc-soft);}
.srch{width:100%;padding:13px 18px;border:none;border-radius:999px;font-size:16px;background:var(--card);
  color:var(--ink);font-family:inherit;margin-bottom:10px;box-shadow:0 1px 2px rgba(27,28,30,.05);}
.srch:focus{outline:2px solid var(--acc);}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px;}
.pcard{background:var(--card);border-radius:18px;padding:15px 6px 12px;text-align:center;
  position:relative;cursor:pointer;border:none;font-family:inherit;
  box-shadow:0 1px 3px rgba(27,28,30,.05);}
.pcard:active{transform:scale(.97);}
.pcard .pico svg{width:28px;height:28px;display:block;margin:0 auto;}
.pimg{width:46px;height:46px;border-radius:12px;object-fit:cover;display:block;margin:0 auto;}
.pcard .nm{font-size:12px;font-weight:700;margin-top:7px;line-height:1.25;}
.pcard .pr{font-size:12px;color:var(--sub);margin-top:3px;font-weight:700;}
.pcard .st{font-size:10.5px;color:var(--sub);margin-top:1px;}
.pcard.dis{opacity:.42;}
.pcard.low .st{color:var(--acc-d);font-weight:700;}
.pcard .nb{position:absolute;top:7px;right:7px;background:var(--dark);color:#fff;border-radius:999px;
  min-width:24px;height:24px;padding:0 5px;font-size:13px;font-weight:800;
  display:flex;align-items:center;justify-content:center;}
.pcard .mo{position:absolute;top:5px;left:5px;width:28px;height:28px;border-radius:50%;
  background:var(--card);border:1.5px solid #D8DADE;font-size:17px;font-weight:800;color:var(--ink);
  cursor:pointer;line-height:1;padding:0;}
.cbar{position:fixed;bottom:0;left:0;right:0;z-index:26;padding:10px 14px 16px;
  background:linear-gradient(180deg,rgba(232,233,236,0),var(--bg) 40%);}
.cbar .in{max-width:820px;margin:0 auto;display:flex;gap:10px;align-items:center;
  background:var(--card);border-radius:999px;padding:8px 8px 8px 22px;
  box-shadow:0 6px 22px rgba(27,28,30,.14);}
.cbar .tt{flex:1;font-size:19px;font-weight:800;}

/* ---------- commandes ouvertes ---------- */
.ocard{background:var(--card);border-radius:20px;padding:16px;margin-bottom:10px;cursor:pointer;
  box-shadow:0 1px 3px rgba(27,28,30,.05);display:flex;align-items:center;gap:12px;border:none;
  width:100%;text-align:left;font-family:inherit;}
.ocard:active{transform:scale(.99);}
.ocard .on{flex:1;min-width:0;}
.ocard .nm{font-size:17px;font-weight:800;}
.ocard .dt{font-size:12.5px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ocard .rs{text-align:right;}
.ocard .rs .m{font-size:19px;font-weight:800;}
.ocard .rs .l{font-size:11px;color:var(--sub);font-weight:600;}
.pline{display:flex;justify-content:space-between;gap:10px;padding:9px 0;
  border-bottom:1px solid var(--line);font-size:15px;}
.pline:last-child{border-bottom:none;}
.trow{display:flex;justify-content:space-between;padding:8px 0;font-size:15.5px;}
.trow b{font-size:17px;}
.trow.grand{border-top:2px solid var(--ink);margin-top:6px;padding-top:12px;}
.trow.grand b{font-size:22px;}

/* ---------- formulaires ---------- */
label{display:block;font-size:11.5px;font-weight:700;color:var(--sub);text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:5px;}
input,select,textarea{width:100%;padding:13px 15px;border:none;border-radius:14px;font-size:17px;
  font-family:inherit;background:var(--key);color:var(--ink);}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);}
.f{margin-bottom:12px;}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* ---------- tableaux ---------- */
table{width:100%;border-collapse:collapse;font-size:14px;}
th,td{padding:10px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;}
tr:last-child td{border-bottom:none;}
th{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.4px;font-weight:700;}
td.num,th.num{text-align:right;white-space:nowrap;}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}

/* ---------- badges & notes ---------- */
.bdg{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;}
.bdg-open{background:var(--acc-soft);color:var(--acc-d);}
.bdg-paid{background:#E5F2E9;color:var(--okc);}
.bdg-cancel{background:#FAE8E5;color:var(--danger);}
.bdg-rep{background:#ECEDEF;color:#4A4D52;}
.note{border-radius:16px;padding:12px 15px;font-size:13.5px;margin-bottom:10px;line-height:1.5;}
.n-green{background:#E5F2E9;color:#174D2B;}
.n-red{background:#FAE8E5;color:#7C241A;}
.n-orange{background:var(--acc-soft);color:#8A4A12;}
.n-grey{background:#EFF0F2;color:#45484D;}
.muted{color:var(--sub);font-size:13px;}
.empty{color:#A6A9AF;font-size:14px;text-align:center;padding:22px 8px;}

/* ---------- équipe ---------- */
.codebig{font-size:40px;font-weight:800;letter-spacing:12px;text-align:center;padding:8px 0 4px;text-indent:12px;}
code.blk{display:block;background:var(--key);border:none;border-radius:14px;padding:12px;
  font-size:10.5px;word-break:break-all;max-height:100px;overflow:auto;
  font-family:ui-monospace,Menlo,monospace;color:#3A3D42;}

/* ---------- fenêtres ---------- */
.ovl{position:fixed;inset:0;background:rgba(20,22,26,.45);display:none;align-items:flex-end;
  justify-content:center;z-index:60;}
.ovl.on{display:flex;}
.mdl{background:var(--card);border-radius:28px 28px 0 0;padding:22px 18px;width:100%;max-width:560px;
  max-height:92vh;overflow-y:auto;position:relative;}
@media(min-width:600px){.ovl{align-items:center;padding:20px;} .mdl{border-radius:28px;}}
.mdl h3{margin:0 36px 14px 0;font-size:21px;font-weight:800;}
.xx{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;background:var(--key);
  border:none;font-size:18px;color:var(--sub);cursor:pointer;line-height:1;}

/* ---------- divers ---------- */
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#1B1C1E;color:#fff;
  padding:13px 22px;border-radius:999px;font-size:14px;z-index:100;opacity:0;pointer-events:none;
  transition:opacity .22s;max-width:88%;text-align:center;}
.toast.on{opacity:1;}
#qrbox{display:flex;justify-content:center;padding:12px;background:#fff;border-radius:16px;}
#qrbox table{border-collapse:collapse;width:auto;} #qrbox td{padding:0;border:none;}
#scanvid{width:100%;border-radius:18px;background:#000;max-height:46vh;object-fit:cover;}
.pays{display:flex;gap:8px;margin-bottom:6px;}
.pays button{flex:1;padding:14px 4px;border-radius:16px;border:2px solid transparent;background:var(--key);
  font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit;color:var(--ink);line-height:1.35;}
.pays button.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc-d);}
.lnk{background:none;border:none;color:var(--sub);font-size:14px;font-weight:700;cursor:pointer;
  font-family:inherit;padding:10px;text-decoration:underline;}
.center{text-align:center;}
.fab{position:fixed;bottom:20px;left:0;right:0;z-index:25;display:flex;justify-content:center;pointer-events:none;}
.fab .btn{pointer-events:auto;box-shadow:0 6px 18px rgba(38,40,44,.3);padding:16px 28px;font-size:16px;}

/* ---------- ticket client ---------- */
#zoneTicket{display:none;}
.tk{background:#fff;color:#000;padding:18px 16px;border-radius:14px;max-width:340px;margin:0 auto;
  font-family:ui-monospace,"Courier New",Menlo,monospace;font-size:13px;line-height:1.5;}
.tk .et{text-align:center;font-size:18px;font-weight:800;letter-spacing:.5px;}
.tk .st{text-align:center;font-size:11.5px;margin-top:2px;}
.tk hr{border:none;border-top:1px dashed #999;margin:10px 0;}
.tk .l{display:flex;justify-content:space-between;gap:8px;}
.tk .l .q{flex:1;}
.tk .tt{display:flex;justify-content:space-between;font-size:16px;font-weight:800;margin-top:6px;}
.tk .fin{text-align:center;font-size:11.5px;margin-top:12px;}
/* planche de QR par table */
.tkq{background:#fff;color:#000;border:1.5px dashed #999;border-radius:12px;padding:14px 10px;
  text-align:center;max-width:300px;margin:0 auto 12px;}
.tkq .qt{font-size:13px;font-weight:800;letter-spacing:.4px;}
.tkq .qn{font-size:26px;font-weight:800;margin:4px 0 6px;}
.tkq .qb{display:flex;justify-content:center;}
.tkq .qf{font-size:10.5px;color:#444;margin-top:6px;}
@media print{
  body > *{display:none !important;}
  #zoneTicket{display:block !important;position:static;}
  #zoneTicket .tk{max-width:none;border-radius:0;padding:0;box-shadow:none;}
  #zoneTicket{display:grid !important;grid-template-columns:1fr 1fr;gap:6mm;}
  #zoneTicket .tk{grid-column:1 / -1;}
  .tkq{break-inside:avoid;page-break-inside:avoid;margin:0;}
  @page{margin:8mm;}
}

/* ---------- carte client (mode public) ---------- */
.mgrid{display:grid;grid-template-columns:1fr;gap:8px;}
.mrow{background:var(--card);border-radius:16px;padding:13px 15px;display:flex;align-items:center;gap:12px;
  border:none;width:100%;text-align:left;font-family:inherit;cursor:pointer;
  box-shadow:0 1px 3px rgba(27,28,30,.05);}
.mrow .mn{flex:1;font-size:15.5px;font-weight:700;}
.mrow .mp{font-size:15.5px;font-weight:800;white-space:nowrap;}
.mrow .mq{background:var(--dark);color:#fff;border-radius:999px;min-width:26px;height:26px;padding:0 7px;
  font-size:13.5px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.mcat{font-size:12px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.6px;
  margin:16px 0 8px;}
.mhead{text-align:center;padding:6px 0 14px;}
.mhead .t{font-size:26px;font-weight:800;}
.mhead .s{font-size:13px;color:var(--sub);margin-top:2px;}
</style>
</head>
<body>

<div class="hdr" id="hdr">
  <button class="hbk hidden" id="tbBack" onclick="retour()">←</button>
  <div class="hm">
    <h1 id="tbTitle">Gestion</h1>
    <div class="sub" id="tbSub"></div>
  </div>
  <button class="hbtn hidden" id="tbBtn" onclick="openSettings()">⋮</button>
</div>

<main><div id="screen"></div></main>

<div class="fab hidden" id="dock"><div id="dockIn"></div></div>
<div class="ovl" id="ovl"><div class="mdl" id="mdl"></div></div>
<div class="toast" id="toast"></div>
<div id="zoneTicket"></div>
